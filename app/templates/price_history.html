<div class="price-history">
{% if price_chart %}
<svg viewBox="0 0 440 260" role="img" aria-labelledby="price-chart-title price-chart-description">
  <title id="price-chart-title">Price development over time</title>
  <desc id="price-chart-description">Observed asking prices in SEK. {% for point in price_chart.points %}{{ point.date }} {{ point.time }}: {{ point.price }} SEK. {% endfor %}</desc>
  <text x="78" y="14">SEK</text>
  {% for tick in price_chart.ticks %}
  <line x1="78" x2="430" y1="{{ tick.y }}" y2="{{ tick.y }}" class="price-grid"/>
  <text x="68" y="{{ tick.y + 4 }}" text-anchor="end">{{ tick.label }}</text>
  {% endfor %}
  <path d="{{ price_chart.path }}" class="price-line"/>
  {% for point in price_chart.points %}
  <circle cx="{{ point.x }}" cy="{{ point.y }}" r="4" class="price-point" tabindex="0" aria-label="{{ point.date }} {{ point.time }}: {{ point.price }} SEK"><title>{{ point.date }} {{ point.time }}: {{ point.price }} SEK</title></circle>
  {% endfor %}
  {% for point in price_chart.ends %}
  {% set anchor = 'middle' if price_chart.ends|length == 1 else ('start' if loop.first else 'end') %}
  <text x="{{ point.x }}" y="228" text-anchor="{{ anchor }}">{{ point.date }}</text>
  <text x="{{ point.x }}" y="246" text-anchor="{{ anchor }}">{{ point.time }}</text>
  {% endfor %}
</svg>
{% if price_chart.points|length == 1 %}<p class="small subtle">One recorded price so far. Changes will appear as more prices are observed.</p>{% endif %}
{% else %}
<p class="small subtle">No price observations available yet.</p>
{% endif %}
</div>
